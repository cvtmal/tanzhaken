doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        # One attribute mapping per module (S2). Dashboard has no entities.
        mappings:
            Shared:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Entity'
                prefix: 'App\Shared\Entity'
                alias: Shared
            Account:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Account/Entity'
                prefix: 'App\Account\Entity'
                alias: Account
            Students:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Students/Entity'
                prefix: 'App\Students\Entity'
                alias: Students
            Courses:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Courses/Entity'
                prefix: 'App\Courses\Entity'
                alias: Courses
            Credits:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Credits/Entity'
                prefix: 'App\Credits\Entity'
                alias: Credits
            Attendance:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Attendance/Entity'
                prefix: 'App\Attendance\Entity'
                alias: Attendance
            CheckIn:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/CheckIn/Entity'
                prefix: 'App\CheckIn\Entity'
                alias: CheckIn

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
