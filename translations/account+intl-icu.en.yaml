# Domain `account` (S7): login, registration, logout and the A3 brand panel (#4).
# Validation messages of the registration form live in validators+intl-icu.en.yaml (account.register.*).
login:
    title: Log in
    heading: Welcome back.
    lede: Your classes and lesson passes, without the paper sheet.
    email:
        label: Email
        placeholder: lena@tanzraum.example
    password:
        label: Password
    forgot: Forgot password?
    submit: Log in
    switch:
        question: 'New to {brand}?'
        link: Create an account
    error:
        invalid: Email or password is wrong.
        throttled: 'Too many attempts. Try again in {minutes, plural, one {# minute} other {# minutes}}.'
        expired: The page expired. Please try again.

register:
    title: Create account
    back: Back to log in
    heading: Create your account
    lede: Set it up once. After that it is just names and ticks.
    name:
        label: Your name
    email:
        label: Email
        taken: This email is already registered. Log in instead?
    password:
        label: Password
        help: 8 characters or more
    submit: Create account
    legal:
        before: By creating an account you agree to the
        link: Privacy Policy
        after: .
    switch:
        question: Already registered?
        link: Log in

logout:
    button: Log out

brand_panel:
    tagline: The attendance sheet,
    tagline_em: without the sheet.
    pass:
        title: 10-lesson pass
        name: Anna M.
        left: '{count, plural, one {# lesson left} other {# lessons left}}'
        hint: one comes off with every tick

# #11: forgot and reset password, the reset mail, the account page.
forgot:
    title: Forgot password
    back: Back to log in
    heading: Forgot your password?
    lede: Enter the email you registered with. We will send you a link to choose a new password.
    email:
        label: Email
    submit: Send link
    switch:
        question: Remembered it?
        link: Log in
    sent: If an account exists for that email, we have sent a link. It is valid for 60 minutes.
    throttled: 'Too many requests. Try again in {minutes, plural, one {# minute} other {# minutes}}.'

reset:
    title: Choose a new password
    heading: Choose a new password
    password:
        label: New password
        help: 8 characters or more
    submit: Save new password
    done: Your password is changed. Log in with the new one.
    invalid:
        title: Invalid link
        heading: This link is invalid or has expired
        text: Reset links work once and for 60 minutes.
        request_new: Request a new link
        back: Back to log in

email:
    password_reset:
        subject: 'Reset your {brand} password'
        greeting: 'Hello {name},'
        intro: 'Someone (hopefully you) asked to reset the password of your {brand} account.'
        open_link: 'Open this link to choose a new password:'
        validity: 'The link works once and is valid for {minutes, plural, one {# minute} other {# minutes}}.'
        ignore: If you did not ask for this, ignore this mail. Your password stays the same.
        sign_off: '— {brand}'

settings:
    title: Account
    heading: Account
    profile:
        heading: Profile
        submit: Save profile
        saved: Profile saved.
    name:
        label: Your name
    timezone:
        label: Time zone
        help: Lesson times use each course's own time zone; this one is used everywhere else.
    password:
        heading: Password
        submit: Change password
        changed: Password changed. Other devices are logged out.
    current_password:
        label: Current password
    new_password:
        label: New password
        help: 8 characters or more
delete:
    heading: Delete account
    lede: 'This deletes your account and everything in it: courses, lessons, students, passes, attendance and history. It cannot be undone.'
    password:
        label: Your password
        help: Enter your password to confirm.
    submit: Delete account
    dialog:
        title: Delete your account?
        text: All your data is removed now and for good.
        cancel: Keep my account
        confirm: Delete everything
    done: Your account and all its data were deleted.
privacy:
    title: Privacy
    heading: Privacy statement
    lede: 'This page explains which data {brand} stores, why, where, for how long, and how it is deleted.'
    updated: 'Last updated: 11 November 2026'
    value:
        placeholder: Placeholder
        not_configured: Not configured
    controller:
        heading: Who is responsible
        intro: 'The operator of this {brand} installation is responsible for the service:'
        name: Name
        address: Address
        email: Email
        teacher: Each teacher who uses the service is responsible for the details of their students that they enter.
    purpose:
        heading: What the data is for
        text: '{brand} helps dance teachers run their courses: schedules, students, lesson passes and the check-in after class. The data is used for that and nothing else.'
    data:
        heading: What is stored
        intro: These are all the kinds of data the service keeps.
        teacher_account:
            heading: Teacher account
            text: 'Your name, your email address, your password (stored only as a hash, never in readable form), your time zone and the date the account was created.'
        students:
            heading: Students
            text: 'First and last name, an optional email address and notes, and the date a student was archived.'
        courses:
            heading: Courses
            text: 'Name, description, location, schedule and time zone of each course.'
        lessons:
            heading: Lessons
            text: 'Start and end time of each lesson, its status and whether it was cancelled.'
        enrollments:
            heading: Enrollments
            text: 'Which student is in which course, the dates they joined and left, and the label shown for them at check-in.'
        credits:
            heading: Passes and credits
            text: 'The passes a student has received: number of lessons, date, an optional note, and the date a pass was voided.'
        attendance:
            heading: Attendance
            text: 'Whether a student was present or absent at a lesson, whether this came from the QR check-in or from the teacher, and when it was recorded.'
        audit_log:
            heading: Change log
            text: 'Who changed what and when, so that corrections to attendance and credits can be traced.'
        security_tokens:
            heading: Check-in and reset links
            text: 'The links for the check-in after class and for resetting a password, stored only as hashes, with the times they were created and expire.'
        rate_limits:
            heading: Rate-limit counters
            text: 'Temporary counters by IP address and email address that slow down repeated attempts, for example at login. They are kept in the server cache, not in the database.'
    storage:
        heading: Where it is stored
        text: The data is kept in a database on the operator's server.
        region: Region
        no_tracking: There is no analytics or tracking, and the pages load no resources from third parties.
        cookies: The only cookie is the session cookie that keeps you logged in.
    retention:
        heading: How long it is kept
        text: Data is kept until the teacher deletes it or deletes the account.
        links: Password reset links are valid for at most 60 minutes and are then removed. Check-in links expire after 60 minutes.
        counters: Rate-limit counters expire with their time window.
    deletion:
        heading: Deleting data
        account: 'On the Account page, Delete account removes the account and all of its data at once.'
        students: Archived students are kept until the account is deleted, but a teacher can remove their email address and notes at any time.
    students:
        heading: For students
        text: 'If you are a student, ask your teacher: they can correct, archive or remove your details. You can also write to the operator at the email address above.'
