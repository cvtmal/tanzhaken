form:
    heading: Form theme
    intro: A Symfony form rendered with the global theme. The email field shows the error state, the form shows the error summary. The eye button needs JavaScript.
    summary: Two things need your attention before the course can be saved.
    name:
        label: Course name
        help: Students see this name when they check in.
        placeholder: e.g. Salsa Beginners
        value: Salsa Beginners
