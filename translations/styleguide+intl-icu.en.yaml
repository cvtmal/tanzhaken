dialog:
    heading: Dialog and sheet
    intro: The confirmation holds back a form submit until you confirm; without JavaScript the button submits at once. The sheet becomes a side panel from 64rem.
    trigger: Close check-in
    title: Close check-in?
    text: Students who have not checked in can no longer do so. You can still mark them present by hand.
    keep_open: Keep open
    confirm: Close check-in
    sheet_trigger: Move student
    sheet_title: Move Elias to
    sheet_legend: Course
    cancel: Cancel
    move: Move

toast:
    heading: Toast
    intro: Success flashes render as a toast. With an action (Undo) it stays until dismissed; without one it hides after 6 seconds, paused while hovered or focused.
    message: Marked present
    undo: Undo

