# Domain `validators`: Symfony's validator translates constraint messages here, not in the module domain.
# Keys carry the module as prefix (account.*, later students.*, …) so modules never collide.
account:
    register:
        name:
            blank: Enter your name.
            too_long: This name is too long.
        email:
            blank: Enter your email address.
            invalid: Enter a full email address.
            too_long: This email address is too long.
        password:
            blank: Choose a password.
            too_short: Use 8 characters or more.
            too_long: This password is too long.
    forgot:
        email:
            blank: Enter your email address.
            invalid: Enter a full email address.
            too_long: This email address is too long.
    settings:
        name:
            blank: Enter your name.
            too_long: This name is too long.
        timezone:
            invalid: Choose a time zone from the list.
        current_password:
            blank: Enter your current password.
            wrong: This is not your current password.
    delete:
        password:
            blank: Enter your password.
            wrong: This is not your password.
students:
    student:
        first_name:
            blank: Enter a first name.
            too_long: This first name is too long.
        last_name:
            blank: Enter a last name.
            too_long: This last name is too long.
        email:
            invalid: Enter a full email address.
            too_long: This email address is too long.
        notes:
            too_long: These notes are too long.
        invalid: Check the name and email and try again.
courses:
    course:
        name:
            blank: Enter a course name.
            too_long: This course name is too long.
        weekday:
            blank: Choose a weekday.
        local_start_time:
            blank: Enter the start time.
        duration:
            blank: Choose a duration.
        location:
            too_long: This location is too long.
        starts_on:
            blank: Enter the date of the first lesson.
        ends_on:
            before_start: The last lesson cannot be before the first one.
    lesson:
        date:
            blank: Enter the date of the lesson.
        time:
            blank: Enter the time of the lesson.
        duration:
            out_of_range: A lesson lasts between 1 and 1440 minutes.
        reason:
            too_long: This reason is too long.
    enroll:
        student:
            blank: Choose a student.
        label:
            too_long: This check-in label is too long.
